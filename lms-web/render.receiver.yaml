# Optional separate web receiver. Do not replace the existing worker's render.yaml.
services:
  - type: web
    name: ax-learningops-web
    runtime: docker
    plan: starter
    dockerfilePath: ./lms-web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: learningops-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BOT_DB_PATH
        value: /app/data/mentoring.db
      # Set the internal connection URL after provisioning Postgres in this service's region.
      # See POSTGRES-MIGRATION.md before the first cutover.
      - key: DATABASE_URL
        sync: false
      - key: PG_NAMESPACE
        value: ax
      - key: PG_POOL_MAX
        value: "10"
      - key: BOT_STORAGE_WORKERS
        value: "2"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ax-learningops-web.onrender.com,https://namyeoungchan.github.io
      - key: LEARNINGOPS_SYNC_TOKEN
        sync: false
      - key: LEARNINGOPS_SOURCE_ID
        value: asan-ax
      - key: LEARNINGOPS_AUTH_TOKEN
        sync: false
      - key: LEARNINGOPS_PROVISION_TOKEN
        sync: false
