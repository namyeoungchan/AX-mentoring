services:
  - type: worker
    name: ax-mentoring-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DB_PATH
        value: /data/mentoring.db
      - key: SYNC_GLOBALLY
        value: false
      # Guilds, channels and roles are stored per workspace in the web registry.
      - key: LEARNINGOPS_PROVISION_URL
        value: https://ax-learningops-web.onrender.com/api/integrations/discord/provision
      - key: LEARNINGOPS_PROVISION_TOKEN
        sync: false
      - key: LEARNINGOPS_AUTH_URL
        value: https://ax-learningops-web.onrender.com/api/integrations/discord/verify
      - key: LEARNINGOPS_AUTH_TOKEN
        sync: false
