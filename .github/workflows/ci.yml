name: LearningOps CI

on:
  pull_request:
    branches: [main, develop, 'release/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learningops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lms-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: lms-web
      - run: python -m pip install -r requirements.txt -r lms-web/server/requirements-storage.txt
      - run: npm run lint && npm test && npm run build
        working-directory: lms-web
      - run: python -m unittest discover -s tests

  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lms-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: lms-web
      - run: python -m pip install -r requirements.txt -r lms-web/server/requirements-storage.txt
      - run: npx playwright install --with-deps chromium
        working-directory: lms-web
      - run: npm run test:rehearsal
        working-directory: lms-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rehearsal-failure
          path: lms-web/test-results
          retention-days: 7
