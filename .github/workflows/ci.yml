name: LearningOps CI

on:
  pull_request:
    branches: [main, develop, 'release/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learningops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lms-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: lms-web
      - run: python -m pip install -r requirements.txt -r lms-web/server/requirements-storage.txt
      - run: npm run lint && npm test && npm run build
        working-directory: lms-web
      - run: python -m unittest discover -s tests

  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ax_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ax_test -d ax_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://ax_test:ci-test-password@127.0.0.1:5432/ax_test
      PLAYWRIGHT_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://ax_test:ci-test-password@127.0.0.1:5432/ax_test' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lms-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: lms-web
      - run: python -m pip install -r requirements.txt -r lms-web/server/requirements-storage.txt
      - run: npx playwright install --with-deps chromium
        working-directory: lms-web
      - run: npm run test:postgres
        if: matrix.database == 'postgres'
        working-directory: lms-web
      - run: npm run test:e2e
        working-directory: lms-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rehearsal-failure-${{ matrix.database }}
          path: lms-web/test-results
          retention-days: 7
